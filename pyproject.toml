[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quizpilot"
version = "0.1.0"
description = "An adaptive quiz coach for learning LangGraph agent architecture."
readme = "README.md"
requires-python = ">=3.11"
# Everything the app needs at runtime, CLI and web alike. These live here
# rather than in an extra because a host that installs this project must get
# a working server: Vercel reads pyproject.toml, and anything kept optional
# simply would not be installed.
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.4,<2",
    "langchain-openrouter>=0.2.8,<0.3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
anthropic = ["langchain-anthropic>=1.0,<2"]
ollama = ["langchain-ollama>=1.0,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1"]

[project.scripts]
quizpilot = "quizpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quizpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
